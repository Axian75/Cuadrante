    <ul>
      <li><b>Casilla elegida</b> y <b>Disponibles</b>: elige una casilla con ${HK('Ctrl')}+clic y verás quién puede cubrirla; pulsa un nombre para ponerlo (en todas las casillas elegidas).</li>
      <li><b>Pendiente esta semana</b>: los ??? y las casillas vacías; pulsa una para ir a ella.</li>
      <li><b>Libres</b> ese día, con sus horas de la semana, y los PDF de la empresa de la semana.</li>
      <li>El botón <b>Panel</b> lo oculta o lo muestra.</li>
    </ul>
    <h4>Barra flotante</h4>
    <ul>
      <li>Siempre está a mano mientras editas. Con casillas elegidas muestra sus acciones (poner persona, sustitutos, borrar, ???, sin servicio, horario, zona cerrada, intercambiar, copiar y pegar).</li>
      <li><b>Muévela</b> arrastrando el asa ⋮⋮: suéltala en el borde izquierdo o derecho y se coloca en vertical en ese lado (el cuadrante le deja sitio); abajo vuelve a su sitio; en cualquier otro punto se queda donde la dejes. Doble clic en el asa la devuelve abajo. Cada ordenador recuerda dónde la dejaste.</li>
    </ul>
    <h4>Una casilla</h4>
    <ul>
      <li><b>Clic</b>: elige la casilla (queda marcada). Otro clic en ella, ${HK('Esc')} o un clic en otra la quitan.</li>
      <li><b>Como en Excel</b>: con una casilla elegida, <b>escribe</b> el nombre (se autocompleta, primero con los disponibles) o una hora y pulsa ${HK('Intro')}; las <b>flechas</b> mueven la casilla elegida y ${HK('Tab')} guarda y pasa a la siguiente. ${HK('Intro')} edita el nombre y ${HK('Mayús', 'Intro')} la hora.</li>
      <li><b>Doble clic</b> en el nombre o en la hora: se cambia ahí mismo (${HK('Intro')} guarda, ${HK('Esc')} cancela).</li>
      <li><b>Ficha rápida</b>: la marquita azul de la esquina de la casilla elegida (o ${HK('F4')}) abre una ficha pequeña con la persona, el horario y los 5 más disponibles; «Más…» abre la ventana completa.</li>
      <li><b>Ventana completa</b> (botón derecho › Editar…): persona con sugerencias y por qué, mañana, tarde o ambas, repetir toda la semana y horario solo de ese día.</li>
      <li><b>---</b> = sin servicio · <b>???</b> = pendiente de cubrir.</li>
    </ul>
    <h4>Filas de puestos</h4>
    <ul>
      <li><b>Clic en el nombre del puesto</b> (columna «Puesto») elige la fila; Ctrl+clic o «Varias» elige varias. Otro clic o Esc la quita.</li>
      <li><b>Botón derecho</b> sobre el puesto: subir, bajar, arriba o abajo del todo, intercambiar con otro puesto (pulsas el otro después) o volver al orden del Excel; ocultar, ver solo esos puestos o mostrar los ocultos; quién ha pasado por el puesto en las últimas semanas; imprimir solo esos puestos.</li>
      <li>En edición, además: elegir todas sus casillas, poner a una persona varios días, copiar los nombres de la semana anterior, copiar sus horarios a otro puesto, «no se cubre esta semana» (---), vaciar la semana y zona cerrada.</li>
      <li>También puedes <b>arrastrar</b> el nombre de un puesto encima de otro para cambiar el orden. El orden y los ocultos solo cambian cómo se ve e imprime (igual en todos los ordenadores); el Excel conserva su orden.</li>
    </ul>
    <h4>Varias casillas</h4>
    <ul>
      <li>En la franja de edición, <b>Una / Varias / Bloque</b> (con ratón y con el dedo): con «Varias» cada clic añade o quita una casilla; con «Bloque» pulsas la primera y la última. También ${HK('Ctrl')}+clic (sueltas) y ${HK('Mayús')}+clic (bloque), como en Excel.</li>
      <li>Abajo aparece una barra: Poner persona, Proponer sustitutos, Borrar (${HK('Supr')}), ???, Sin servicio, Horario, Zona cerrada/Reabrir, Intercambiar (con dos casillas), Copiar (${HK('Ctrl', 'C')}) y Pegar (${HK('Ctrl', 'V')}). ${HK('Esc')} quita la selección.</li>
      <li><b>Botón derecho</b> en una casilla abre un menú con Editar…, cambiar nombre u horario ahí, ficha rápida y las mismas acciones. En la consulta, el botón derecho ofrece editar la casilla, resaltar a la persona, su ficha, quién está libre ese día, comparar con la semana anterior e imprimir.</li>
      <li><b>Arrastrar</b> un nombre a otra casilla lo mueve; si la casilla tenía a alguien, se intercambian; con ${HK('Ctrl')} se copia.</li>
    </ul>
    <h4>Horarios</h4>
    <ul>
      <li><b>Editar horarios</b>: tabla de entrada y salida de toda la semana. Escribe en la casilla del día que cambie, o usa el cambio rápido (día, puesto, entrada o salida y nueva hora). En naranja, lo que no es el horario habitual de DATOS.</li>
      <li>Formatos: 10.00 · 7.45 · 10 - 15 · 13.30-14.30.</li>
    </ul>
    <h4>Zona cerrada</h4>
    <ul>
      <li>Para salas cerradas por montaje, obras, etc.: elige puestos, días y motivo. Cuenta 0 horas y no genera ??? ni avisos. «Reabrir» devuelve el horario y las personas.</li>
    </ul>
    <h4>Vaciar nombres y sustitutos</h4>
    <ul>
      <li><b>Vaciar nombres</b> deja la semana (o un día, o un servicio) con ??? o en blanco para rehacerla.</li>
      <li><b>Proponer sustitutos</b> rellena los ??? con quien está disponible: sin ausencias, sin descanso corto, sin pasarse de días seguidos ni de su jornada, y teniendo en cuenta la programación de la empresa y la rotación.</li>
    </ul>` },
  { id: 'recuperar', t: 'Historial, recuperar y trabajar en varios equipos', h: `
    <p><b>Historial y recuperar</b> (pestaña Semana o flecha de Editar) te deja volver atrás una semana:</p>
    <ul>
      <li><b>Versiones guardadas por la app</b>: cada vez que guardas o imprimes, la app guarda una foto de la semana <b>dentro del Excel</b> (hoja oculta APP_HISTORIAL), con la hora y el equipo. Se ven desde cualquier ordenador o el iPad. También puedes guardar una a mano, con una nota.</li>
      <li><b>Desde un PDF impreso con la app</b>: eliges el PDF y la app lee la tabla (puestos, días, horas y nombres). Los PDF impresos desde esta versión llevan además los datos de la semana escondidos, así que se recuperan exactos aunque estén reducidos. (Si imprimiste «como imagen», el PDF no tiene texto y no se puede leer.)</li>
      <li><b>Desde otro Excel</b>: una copia, el de otro equipo o una copia de conflicto de OneDrive.</li>
      <li><b>Versiones anteriores en OneDrive</b> (si abres el Excel desde OneDrive): OneDrive guarda una versión cada vez que se guarda.</li>
    </ul>
    <p>En todos los casos ves las diferencias casilla a casilla (tachado lo de ahora, en negrita lo que se recuperaría) y eliges: <b>copiar tal cual</b>, <b>solo huecos</b> (vacíos y ???) o <b>las casillas que marques</b>. Antes de aplicar, la app guarda una versión de cómo estaba, y Ctrl+Z lo deshace.</p>
    <p><b>Código QR de la semana</b> (pestaña Semana o Impresión): sale en pantalla un código; apunta la cámara del móvil y abre el enlace: verás la semana tal cual está y podrás guardarla en PDF, compartirla o hacerle una foto. Los datos van dentro del código (no pasan por ningún servidor). Si abres ese enlace en el equipo con el Excel, «Recuperar en el cuadrante» la compara y la recupera como un PDF. Necesita la dirección de la app web (la del iPad), en Ajustes › Datos y copias; si abres la app desde esa dirección se rellena sola.</p>
    <p><b>Varios equipos</b>: cada equipo tiene un nombre (Ajustes › Datos y copias). El Excel recuerda qué equipo lo guardó y cuándo (se ve arriba, junto al nombre del archivo). Si al guardar el Excel ya se había guardado desde otro equipo, la app <b>junta los cambios</b> de los dos en vez de pisar unos u otros; solo te pregunta por las casillas que cada equipo cambió de forma distinta.</p>
    <p><b>Aviso rojo</b>: si hay cambios sin guardar más de dos minutos, si la sesión de Microsoft caduca o si no se puede guardar, sale abajo un aviso rojo con el botón para arreglarlo. El título de la pestaña lleva un ● mientras haya cambios sin guardar.</p>` },
  { id: 'casillas', t: 'Horas y nombres: elegir, borrar, restaurar', h: `
    <p>En la consulta y en edición funciona igual:</p>
    <ul>
      <li><b>Un clic en la hora</b> elige solo la hora; <b>un clic en el nombre</b> elige solo el nombre (se marca en azul). Otro clic, Esc o un clic fuera lo quita. Con Ctrl o Mayús eliges varias.</li>
      <li><b>Supr</b> borra lo elegido: el nombre o la hora. ${HK('Ctrl', 'Z')} lo deshace (también el botón ↶ junto a la semana).</li>
      <li><b>Doble clic</b> (o Intro) para cambiarlo ahí mismo. <b>Arrastra un nombre</b> a otra casilla para moverlo (con Ctrl, para copiarlo), sin necesidad de entrar en edición.</li>
      <li><b>Botón derecho</b> en una casilla: cambiar nombre u horario, poner persona, proponer sustituto, <b>borrar el nombre</b>, <b>borrar el horario</b>, <b>borrar la casilla</b>, <b>restaurar el horario habitual</b>, zona cerrada, resaltar, ficha…</li>
      <li><b>Botón derecho en el día</b> (cabecera): restaurar el horario habitual de ese día o borrar el cuadrante de ese día.</li>
      <li><b>Botón derecho en el puesto</b>: restaurar su horario habitual, borrar sus nombres de la semana, ocultarlo, ordenarlo…</li>
      <li><b>Borrar cuadrante</b> (pestaña Semana o flecha de Editar): elige días y puestos; los nombres quedan con ??? o en blanco y los horarios se pueden dejar, volver a los habituales o borrar.</li>
      <li><b>Restaurar horarios habituales</b>: pone el horario de la pestaña Puestos en los días y puestos que elijas, también en las semanas siguientes si quieres.</li>
      <li>En la celda <b>Puesto</b> de la cabecera del cuadrante tienes <b>Coord. / Vigil.</b> para ver unos, otros o los dos.</li>
      <li>Cuando ocultas un puesto, el puesto de al lado lleva una <b>señal naranja en la esquina</b>: púlsala para volver a verlo. Si quitas Coord. y Vigil., la cabecera (días, mañana y tarde) se queda.</li>
    </ul>` },
  { id: 'barra', t: 'Barra del cuadrante, temas y buscador', h: `
    <p>Arriba del cuadrante siempre ves la <b>semana</b> (con ‹ › para pasar de una a otra), <b>Coordinadores / Vigilantes</b> y el botón <b>Editar</b>. El resto de opciones está ordenado por secciones:</p>
    <ul>
      <li><b>Semana</b>: nueva semana, ir a la semana de hoy, borrar cuadrante, restaurar horarios habituales y CSV. Al lado de la semana, <b>＋</b> crea una nueva y <b>↶</b> deshace el último cambio.</li>
      <li><b>Ver</b>: resaltar a una persona, tamaño, relevo, ajustar a la pantalla, puestos ocultos y orden de puestos.</li>
      <li><b>PDF empresa</b>: qué PDF tiene esta semana (el número rojo indica los que faltan; pulsa uno cargado para <b>ver el PDF original</b>), importar, rellenar, buscar actualizaciones en la carpeta y ver los PDF cargados. La lista completa está también al final de la página.</li>
      <li><b>Imprimir</b>: la semana, solo coordinadores, solo vigilantes, una hoja por servicio, fichas y «como imagen».</li>
      <li>La flecha de <b>Editar</b> abre directamente horarios, vaciar, zona cerrada y sustitutos.</li>
    </ul>
    <p><b>Cinta con pestañas</b> (la forma normal): pulsa una pestaña para ver sus opciones; pulsa otra vez la misma pestaña, o la flecha de la derecha, para <b>ocultarlas</b> y dejar solo la fila de pestañas. En Ajustes puedes hacer que la cinta empiece recogida o que se recoja sola después de usar una opción.</p>
    <p><b>Botones de sección con menú</b>: en Ajustes → Colores y barras puedes cambiar la cinta por botones; cada uno abre su menú con la flecha.</p>
    <p><b>Favoritos</b>: en los menús y en el buscador, la chincheta fija esa acción como botón en la barra. Para quitarla, clic derecho sobre el botón fijado (o la chincheta otra vez).</p>
    <p><b>Buscador de acciones</b> (se activa en Ajustes › Aspecto y barras): ${HK('Ctrl', 'K')} o el botón Buscar, y escribe lo que quieres hacer: «pdf», «imprimir vigilantes», «horarios», «nueva persona»…</p>
    <p><b>Temas de color</b>: Pizarra, Museo, Ría y Noche, en Ajustes → Colores y barras. También hay barras compactas y «solo iconos». Estos ajustes son de cada equipo (no viajan en el Excel).</p>` },
  { id: 'semanas', t: 'Crear semanas', h: `
    <ul>
      <li><b>Nueva semana</b>: eliges el número y cómo rellenarla: desde el cuadrante de la empresa (PDF), copia de la semana anterior, semana tipo o en blanco.</li>
      <li>Opciones: poner ??? a quien esté ausente, ajustar a la programación de la empresa y proponer sustitutos.</li>
      <li>Las zonas cerradas de la semana copiada se mantienen.</li>
    </ul>` },
  { id: 'pdf', t: 'PDF de la empresa', h: `
    <h4>Importar</h4>
    <ul>
      <li><b>Importar PDF empresa</b> (en Cuadrante): puedes elegir varios PDF a la vez (vigilantes y coordinadores). El servicio se reconoce por el membrete y se puede corregir.</li>
      <li>Sirven también los PDF que la empresa manda <b>reimpresos</b> (con Acrobat o «Imprimir a PDF»), aunque al copiar su texto salgan símbolos raros: la app reconoce las letras por su forma. Si alguna persona no cuadra con su «Total H.», la app lo avisa.</li>
      <li>La app reconoce a cada persona, te deja revisar el vínculo con tu «Nombre en cuadrante», añade las nuevas al personal y comprueba que las horas cuadran con los totales del PDF.</li>
      <li>En la pestaña <b>PDF empresa</b> ves qué PDF tienes cargados para esa semana (en verde) y cuáles faltan (en amarillo). Pulsa uno verde para <b>ver el PDF original</b> tal cual lo mandó la empresa, abrirlo en otra pestaña o descargarlo; «Ver los datos leídos» enseña lo que la app ha entendido.</li>
      <li>El original se guarda <b>en el equipo donde lo importas</b> (no dentro del Excel, para no hacerlo pesado) y, si quieres, <b>en OneDrive</b>: en Ajustes › PDF de la empresa, «Guardar una copia en OneDrive» (carpeta «PDF empresa» junto al Excel, si lo abres desde OneDrive) o «Copiar a la carpeta de PDF» eligiendo una carpeta dentro de tu OneDrive. En otro ordenador o en el iPad la app lo busca ahí.</li>
      <li><b>Vínculos</b>: en Ausencias e incidencias › Cuadrante de la empresa, la columna «En tu cuadrante» es un desplegable. Si alguien del PDF está unido a quien no es (p. ej. LARA con MARÍA), cámbialo ahí: vale para todos los meses y la app lo recuerda. Después usa «Rellenar con PDF».</li>
      <li>Al <b>rellenar</b>, la opción «Borrar los horarios y poner exactamente los de la empresa» pone en cada casilla el horario que la empresa programa a esa persona, también a quien ya estaba puesto.</li>
    </ul>
    <h4>Rellenar con el PDF</h4>
    <ul>
      <li><b>Rellenar con PDF</b>: eliges uno o varios días de la semana, la semana entera o todas las semanas de un mes (crea las que falten).</li>
      <li>Por defecto <b>solo rellena los huecos vacíos y los ???</b>, sin tocar lo que ya has puesto. También puedes cambiar a quien la empresa no programa o rehacer todos los nombres.</li>
      <li>El PDF dice quién trabaja y a qué hora, no en qué puesto: la app coloca a cada persona en un puesto de su servicio con un horario parecido y, si quieres, pone el horario de la empresa.</li>
      <li>Te avisa de quién queda programado sin puesto y de los días en los que el PDF no programa a nadie.</li>
    </ul>
    <h4>Actualizaciones de la empresa</h4>
    <ul>
      <li>Cuando la empresa manda una versión nueva del mismo mes, impórtala sin más (o pulsa <b>sustituir</b> en «Todos los PDF cargados»): la app te enseña qué ha cambiado, persona a persona y día a día, antes de cargarlo.</li>
      <li>Después, <b>Aplicar los cambios</b> actualiza solo los días que han cambiado: mantiene a quien la empresa sigue programando, cambia a quien ya no está y rellena los huecos. El resto del cuadrante no se toca.</li>
      <li>Cada PDF guarda su historial (columna «Versiones»): qué archivo había antes, cuándo se cargó y sus horas.</li>
      <li><b>Carpeta de PDF</b>: pulsa «Elegir carpeta de PDF…» una vez y elige la carpeta donde guardas los PDF de la empresa. Después, <b>⟳ Buscar actualizaciones</b> encuentra los PDF más nuevos que los cargados (meses nuevos o versiones nuevas), te dice qué cambia en cada uno y cargas los que marques.</li>
      <li>Las semanas que la empresa ha cambiado aparecen con <b>⚠ actualizada</b> en el selector de semanas y con un aviso en el cuadrante (qué días cambian). Pulsa «Visto» cuando la hayas revisado.</li>
      <li>Al aplicar los cambios puedes <b>anotarlos en Incidencias</b>: cada casilla cambiada queda registrada con quién sale, quién entra y el motivo «Actualización de la empresa».</li>
      <li><b>Eliminar</b> quita un PDF. Eliges si mantener lo que ya está en el cuadrante o pasar a ??? los turnos que coinciden con él, y si quitar también sus horas facturadas.</li>
    </ul>
    <h4>Consultar</h4>
    <ul><li>En Ausencias e incidencias › Cuadrante de la empresa ves cada PDF día a día y la diferencia de horas con tu cuadrante.</li></ul>` },
  { id: 'rotacion', t: 'Rotación de puestos', h: `
    <ul>
      <li>Al rellenar con el PDF y al proponer sustitutos, cada persona intenta <b>no repetir los puestos de las semanas anteriores</b>, siempre dentro de su servicio (coordinadores en puestos de coordinación, vigilantes en los de vigilancia).</li>
      <li>Pesa más la semana pasada y menos las anteriores. Por defecto mira <b>4 semanas</b>; se cambia en Ajustes.</li>
      <li>Dentro de la misma semana, cada persona intenta <b>seguir en su zona</b>; puede cambiar algún día si hace falta.</li>
      <li>Informe <b>Rotación de puestos</b> (Informes): tabla de personas por puestos con los días en cada uno, cuántos puestos distintos ha hecho y si repite el de la semana anterior.</li>
    </ul>` },
  { id: 'puestos', t: 'Puestos y horario habitual', h: `
    <ul>
      <li>Pestaña <b>Puestos</b>: es la tabla «Puestos y horario habitual» de la hoja DATOS. Cambia nombre, ID, tipo (vigilancia o coordinación) y las horas <b>M</b> (mañana) y <b>T</b> (tarde) de cada día; vacío = ese día no hay servicio. Lo cambiado se marca en amarillo (al pasar el ratón ves lo que había).</li>
      <li>Un horario habitual nuevo se aplica desde la semana que elijas en «Los cambios de horario valen desde la…» (por defecto, la actual); las semanas anteriores conservan su horario. Las casillas con un horario especial no se tocan.</li>
      <li>Para añadir o quitar puestos hay que hacerlo en el Excel, porque cambia la forma de todas las semanas.</li>
    </ul>` },
  { id: 'ipad', t: 'iPad, OneDrive y SharePoint', h: `
    <h4>Instalar en el iPad</h4>
    <ul>
      <li>Abre en Safari la dirección web de la app y pulsa <b>Compartir › Añadir a la pantalla de inicio</b>. Queda como una app más, a pantalla completa, y funciona también sin conexión (salvo abrir y guardar en OneDrive).</li>
      <li>Si en la dirección hay una versión nueva, la app la usa sola la próxima vez que la abras con conexión.</li>
    </ul>
    <h4>Abrir y guardar el Excel (OneDrive en el iPad)</h4>
    <ul>
      <li>Instala en el iPad la app de <b>OneDrive</b>: así tu OneDrive aparece en <b>Archivos</b>.</li>
      <li><b>Abrir</b>: «Elegir archivo» › Archivos › OneDrive › tu Excel.</li>
      <li><b>Guardar</b>: pulsa <b>Guardar en Archivos</b>, después «Guardar en Archivos» en el menú del iPad, entra en OneDrive, en la carpeta del Excel, y elige <b>Reemplazar</b>. En el iPad no hay guardado automático: guarda al terminar.</li>
      <li>Al volver al PC pulsa <b>Actualizar</b> para ver lo que guardaste desde el iPad. No trabajes en el PC y en el iPad a la vez.</li>
    </ul>
    <h4>Guardar en Archivos en el PC</h4>
    <ul>
      <li>El botón <b>Guardar en Archivos</b> (arriba) te deja elegir dónde guardar el Excel, por ejemplo tu carpeta de OneDrive: elige el archivo del cuadrante y confirma «Reemplazar». Desde entonces los cambios se guardan solos ahí.</li>
    </ul>
    <h4>Conexión directa con Microsoft 365 (opcional)</h4>
    <ul>
      <li>Si informática registra la app en Microsoft, en <b>Ajustes › Microsoft 365</b> se puede iniciar sesión y abrir y guardar el Excel directamente en OneDrive o SharePoint, con guardado automático también en el iPad.</li>
    </ul>
    <h4>Con el dedo</h4>
    <ul>
      <li><b>Toque</b>: elige la casilla; otro toque la quita. <b>Doble toque</b>: cambia el nombre ahí mismo (o la hora, si tocas la hora). <b>Mantener pulsado</b>: el menú de opciones (como el botón derecho).</li>
      <li>En la franja de edición, <b>Una / Varias / Bloque</b>: con «Varias» cada toque añade o quita una casilla (como Ctrl); con «Bloque» tocas la primera y la última (como Mayús).</li>
      <li>La marquita de la esquina de la casilla elegida abre la ficha rápida. Con teclado conectado al iPad funciona todo como en el PC (escribir, flechas, Tab, Esc).</li>
      <li>Imprimir: abre la impresión del iPad (AirPrint) o «Guardar en Archivos» como PDF.</li>
    </ul>` },
  { id: 'personas', t: 'Personas', h: `
    <ul>
      <li>Lista con buscador y filtros (activos, coordinadores, vigilantes) y horas de la semana de cada uno.</li>
      <li><b>Nueva persona</b>: da de alta a alguien en el personal (hoja DATOS del Excel): nombre en cuadrante (como saldrá en las casillas, único), nombre, apellidos, tipo (vigilante, coordinador/a o ambos), horas de contrato y notas. Se guarda en el Excel como el resto de cambios.</li>
      <li><b>Editar datos</b>: cambia los datos de la persona elegida. El nombre en cuadrante no se cambia (lo usan las semanas). Quitando «En activo» queda <b>de baja</b>: no sale en sugerencias ni en «libres», pero se conserva su historial; si tiene turnos futuros, la app te lo avisa.</li>
      <li>Ficha de la persona: semana con puestos, entradas, salidas y horas; horas por mes; fines de semana, festivos y jornadas largas; ausencias.</li>
      <li><b>Imprimir ficha</b> y <b>Fichas de toda la semana</b> («Mi semana» de cada uno).</li>
      <li><b>App para vigilantes</b>: genera una página para el móvil donde cada vigilante consulta sus turnos.</li>
    </ul>` },
  { id: 'horas', t: 'Horas', h: `
    <ul>
      <li>Horas por persona de la semana, el mes o el año, separadas en coordinación y vigilancia, frente a su contrato.</li>
      <li>Filtro por servicio, exportar a CSV e imprimir.</li>

  const w = DATA.semanas[UI.wi]; const get = key => { const [k, i, t] = key.split('|'); const s = w.slots.find(x => x.k === +k); return { s, sd: s.days[+i], t }; };
  const a = get(DRAG.key), b = get(td.dataset.cell); const copy = e.ctrlKey || e.metaKey || e.altKey;
  if (DRAG.key === td.dataset.cell || isClosed(b.sd)) { DRAG = null; return; }
  const prev = b.sd[b.t]; b.sd[b.t] = DRAG.name; if (!copy) a.sd[a.t] = valid(prev) ? prev : '';
  DRAG = null; buildModel(); markDirty(); render();
  toast(copy ? `${b.sd[b.t]} copiado.` : valid(prev) ? `Intercambiados ${b.sd[b.t]} y ${prev}.` : `${b.sd[b.t]} movido.`, 2500);
}, true);

/* ---------- menú con clic derecho ---------- */
function closeCtx() { $('#ctxmenu')?.remove(); }
document.addEventListener('contextmenu', e => {
  const td = e.target.closest('table.cq td[data-cell]'); if (!td || UI.view !== 'cuadrante') return;
  e.preventDefault(); closeCtx();
  if (!SEL.set.has(td.dataset.cell)) { SEL.set.clear(); SEL.set.add(td.dataset.cell); SEL.anchor = td.dataset.cell; SEL.part = td.classList.contains('closed') ? null : e.target.closest('.hr') ? 'hr' : e.target.closest('.nm') ? 'nm' : null; selPaint(); }
  const n = SEL.set.size; const cs = selCells(); const anyClosed = cs.some(c => isClosed(c.sd)); const allClosed = cs.every(c => isClosed(c.sd));
  const c1 = cellOf(td.dataset.cell); const nm = c1 && !isClosed(c1.sd) ? c1.sd[c1.t] : ''; const per = n === 1 && valid(nm) && M.pIdx.has(nm) ? nm : null;
  const ed = !ro() && (UI.edit || FX('Ctx')); const prt = SEL.part; const rOnly = cs.every(c => c.t === 'R');
  const it = (a, l) => `<button data-sel="${a}">${l}</button>`, iq = (a, l) => `<button data-cq="${a}">${l}</button>`;
  const gNom = `<div class="cm-g">Nombre</div>${it('person', 'Poner persona…')}${it('suggest', 'Proponer sustituto')}${it('clear', 'Borrar el nombre')}${it('q', 'Marcar ???')}${it('none', 'Sin servicio (---)')}`;
  const gHor = rOnly ? '' : `<div class="cm-g">Horario</div>${it('hours', 'Cambiar el horario…')}${it('rehab', 'Restaurar el horario habitual')}${it('clrhr', 'Borrar el horario')}`;
  const gCas = `<div class="cm-g">Casilla</div>${allClosed ? '' : it('clrall', 'Borrar la casilla (nombre y horario)')}${anyClosed ? it('open', 'Reabrir') : it('close', 'Zona cerrada…')}${n === 2 && FX('Drag') ? it('swap', 'Intercambiar las dos') : ''}${it('copy', 'Copiar')}${SEL.clip ? it('paste', 'Pegar aquí') : ''}`;
  const m = document.createElement('div'); m.id = 'ctxmenu'; m.className = 'ctxmenu'; m.setAttribute('role', 'menu');
  m.innerHTML = `<div class="cm-h">${n > 1 ? `${n} casillas` : `${esc(c1.s.puesto)} · ${DIA3[c1.i]} ${dayNum(c1.w.days[c1.i])}${nm ? ' · ' + esc(nm) : ''}`}${prt ? ` <span class="cm-part">${prt === 'hr' ? 'horario' : 'nombre'}</span>` : ''}</div>
   ${ed ? `${n === 1 && !allClosed ? it('inlnm', 'Cambiar el nombre aquí') + (rOnly ? '' : it('inlhr', 'Cambiar el horario aquí')) + it('edit1', 'Editar la casilla…') : ''}
   ${allClosed ? gCas : prt === 'hr' ? gHor + gNom + gCas : gNom + gHor + gCas}` : ''}
   <div class="cm-g">Ver</div>${per ? iq('hl', UI.hl === per ? 'Quitar el resaltado' : `Resaltar a ${esc(per)}`) + iq('ficha', `Ficha de ${esc(per)}`) : ''}${n === 1 ? iq('libres', `Quién está libre el ${DIAS[c1.i].toLowerCase()}`) : ''}${iq('print', 'Imprimir la semana…')}${!UI.edit && !ro() ? iq('editmode', 'Entrar en edición con esto elegido') : ''}`;
  m.dataset.cell = td.dataset.cell; m.dataset.per = per || '';
  document.body.appendChild(m); const r = m.getBoundingClientRect();
  m.style.left = Math.min(e.clientX, innerWidth - r.width - 8) + 'px'; m.style.top = Math.max(8, Math.min(e.clientY, innerHeight - r.height - 8)) + 'px';
  m.querySelector('button')?.focus();
});
/* botón derecho en la cabecera de un día */
document.addEventListener('contextmenu', e => {
  const th = e.target.closest('table.cq th[data-day]'); if (!th || UI.view !== 'cuadrante') return; e.preventDefault(); closeCtx();
  const i = +th.dataset.day; const w = DATA.semanas[UI.wi]; const s0 = w.slots.find(s => !isClosed(s.days[i])) || w.slots[0];
  const iq = (a, l) => `<button data-cq="${a}">${l}</button>`;
  const m = document.createElement('div'); m.id = 'ctxmenu'; m.className = 'ctxmenu'; m.setAttribute('role', 'menu');
  m.innerHTML = `<div class="cm-h">${DIAS[i]} ${dayNum(w.days[i])}</div>${ro() ? '' : iq('dayrehab', 'Restaurar el horario habitual del día…') + iq('dayclear', 'Borrar el cuadrante del día…')}${iq('libres', `Quién está libre el ${DIAS[i].toLowerCase()}`)}${iq('print', 'Imprimir la semana…')}`;
  m.dataset.cell = `${s0.k}|${i}|M`; m.dataset.per = '';
  document.body.appendChild(m); const r = m.getBoundingClientRect();
  m.style.left = Math.min(e.clientX, innerWidth - r.width - 8) + 'px'; m.style.top = Math.min(e.clientY, innerHeight - r.height - 8) + 'px';
});
document.addEventListener('click', e => { const b = e.target.closest('#ctxmenu [data-sel]'); if (b && b.dataset.sel === 'edit1') { const [k, i, t] = [...SEL.set][0].split('|'); closeCtx(); selClear(); cellEditor(+k, +i, t); return; }
  if (b && ['inlnm', 'inlhr', 'quick'].includes(b.dataset.sel)) { const td = $(`table.cq td[data-cell="${[...SEL.set][0]}"]`); closeCtx(); if (td) { if (b.dataset.sel === 'quick') openQuick(td); else openInline(td, b.dataset.sel === 'inlhr' ? 'hr' : 'nm'); } return; } if (!e.target.closest('#ctxmenu') || b) setTimeout(closeCtx, 0); });
document.addEventListener('keydown', e => { if (e.key === 'Escape' && UI.hl && UI.view === 'cuadrante' && !$('dialog[open]') && !INL && !$('#quick')) { UI.hl = ''; render(); } if (e.key === 'Escape') { closeCtx(); if (UI.dd) { UI.dd = null; $$('.dd-m').forEach(m => { m.hidden = true; }); } } });
window.addEventListener('scroll', closeCtx, { passive: true });

/* ---------- ficha rápida al pasar el ratón por un nombre ---------- */
let cardT = null;
function hideCard() { clearTimeout(cardT); $('#pcard')?.remove(); }
document.addEventListener('mouseover', e => {
  const nm = e.target.closest?.('table.cq .nm[data-p]'); if (!nm || !FX('Card') || DRAG || LAST_PT === 'touch') return;
  clearTimeout(cardT); cardT = setTimeout(() => {
    const per = nm.dataset.p; const td = nm.closest('td[data-cell]'); const w = DATA.semanas[UI.wi]; const i = +td.dataset.cell.split('|')[1]; const day = w.days[i];
    const p = M.pIdx.get(per); const wk = sumRange(per, w.monday, w.days[6]); const run = runEnding(per, day); let fwd = 0, d = addD(day, 1); while (worked(per, d) && fwd < 30) { fwd++; d = addD(d, 1); }
    const o = pd(per, day), prev = pd(per, addD(day, -1)); const rest = o && prev && o.st != null && prev.en != null ? 24 - prev.en + o.st : null;
    const target = p ? (p.contrato ?? M.P.jornadaDef) : null; const a = ausOn(per, day);
    const row = (l, v, cls = '') => `<div class="pr"><span class="muted">${l}</span><span class="${cls}">${v}</span></div>`;
    const c = document.createElement('div'); c.id = 'pcard'; c.className = 'pcard';
    c.innerHTML = `<b class="pn">${esc(per)}</b><div class="muted small">${esc(p ? fullName(p) || (p.tipo === 'Coord.' ? 'Coordinador/a' : 'Vigilante') : 'No está en DATOS')}</div>
      ${row('Horas esta semana', `${H(wk.t)} h${target ? ` de ${H(target)}` : ''}`, target && wk.t > target + 0.01 ? 'warn' : '')}
      ${wk.c && wk.v ? row('Coord. / vigil.', `${H(wk.c)} / ${H(wk.v)} h`) : ''}
      ${row('Días trabajados', `${wk.days} esta semana`)}
      ${row('Días seguidos', `${run + fwd}`, run + fwd > M.P.maxDias ? 'crit' : '')}
      ${rest != null ? row('Descanso desde ayer', `${hhmm(rest)} h`, rest < M.P.descansoMin ? 'crit' : '') : ''}
      ${a ? row('Ausencia', esc(a.tipo), 'crit') : ''}`;
    document.body.appendChild(c); const r = nm.getBoundingClientRect(), cr = c.getBoundingClientRect();
    let x = r.left + r.width / 2 - cr.width / 2, y = r.bottom + 8; if (y + cr.height > innerHeight - 8) y = r.top - cr.height - 8;
    c.style.left = Math.max(8, Math.min(x, innerWidth - cr.width - 8)) + 'px'; c.style.top = y + 'px';
  }, 450);
});
document.addEventListener('mouseout', e => { if (e.target.closest?.('table.cq .nm[data-p]')) hideCard(); });
document.addEventListener('mousedown', hideCard); window.addEventListener('scroll', hideCard, { passive: true });
</script>
