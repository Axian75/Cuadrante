<title>Cuadrante Seguridad</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&family=Barlow+Condensed:wght@500;600;700&display=swap">
<style>
/* Concepto: sala de control. Banda pizarra fija arriba, paneles claros; el ocre marca semana, hoy, cambios y acciones. */
:root{
  --bg:#F2F4F7; --surface:#FFFFFF; --surface-2:#F7F8FA; --ink:#1B2433; --muted:#5E6B7E; --line:#DCE1E8; --line-2:#C3CAD5;
  --band:#22324A; --band-2:#3A4E6B; --band-ink:#FFFFFF; --band-muted:#B9C3D2;
  --accent:#B8893A; --accent-soft:#F4EAD6; --accent-ink:#FFFFFF;
  --coord:#24527A; --coord-bg:#E3EBF4; --vs:#2F7A5F; --vs-bg:#E3F1EA;
  --warn:#8A5300; --warn-bg:#FCE7B2; --crit:#9B1C1C; --crit-bg:#FBE3E3; --info:#2E5AAC; --info-bg:#E6ECF7;
  --fest-bg:#FBEFEF; --special:#B4541A; --special-bg:#FDF1E3; --vanilla:#FFF7D6; --sel:#2E6BD8; --sel-bg:#DCE8FB;
  --f-body:"Barlow", "Segoe UI", system-ui, sans-serif;
  --f-cond:"Barlow Condensed", "Arial Narrow", "Segoe UI", sans-serif;
  --r:6px; color-scheme:light;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#10161F; --surface:#18212D; --surface-2:#1D2734; --ink:#E6EAF0; --muted:#97A3B5; --line:#2A3544; --line-2:#3A4757;
  --band:#0D141E; --band-2:#1F2D42; --band-ink:#F2F4F7; --band-muted:#8C99AC;
  --accent:#D5A754; --accent-soft:#3A2F1A; --accent-ink:#17120A;
  --coord:#86AEDB; --coord-bg:#1B2A3D; --vs:#72C3A0; --vs-bg:#16302A;
  --warn:#F2C46D; --warn-bg:#3A2E12; --crit:#F29A9A; --crit-bg:#3D1D1D; --info:#93B1EA; --info-bg:#1C2740;
  --fest-bg:#2C1D22; --special:#F0A06A; --special-bg:#3A2616; --vanilla:#2F2A17; --sel:#7EA8F0; --sel-bg:#1E2C47; color-scheme:dark; }}
:root[data-theme="dark"]{
  --bg:#10161F; --surface:#18212D; --surface-2:#1D2734; --ink:#E6EAF0; --muted:#97A3B5; --line:#2A3544; --line-2:#3A4757;
  --band:#0D141E; --band-2:#1F2D42; --band-ink:#F2F4F7; --band-muted:#8C99AC;
  --accent:#D5A754; --accent-soft:#3A2F1A; --accent-ink:#17120A;
  --coord:#86AEDB; --coord-bg:#1B2A3D; --vs:#72C3A0; --vs-bg:#16302A;
  --warn:#F2C46D; --warn-bg:#3A2E12; --crit:#F29A9A; --crit-bg:#3D1D1D; --info:#93B1EA; --info-bg:#1C2740;
  --fest-bg:#2C1D22; --special:#F0A06A; --special-bg:#3A2616; --vanilla:#2F2A17; --sel:#7EA8F0; --sel-bg:#1E2C47; color-scheme:dark; }

*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:15px/1.45 var(--f-body);-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3{margin:0;font-family:var(--f-cond);font-weight:600;letter-spacing:.01em;text-wrap:balance}
.num,td.n,th.n{font-variant-numeric:tabular-nums}
[hidden]{display:none!important}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* banda superior */
.band{background:var(--band);color:var(--band-ink);position:sticky;top:0;z-index:20;border-bottom:3px solid var(--accent)}
.band-in{max-width:1480px;margin:0 auto;padding:10px max(16px,env(safe-area-inset-right,0px)) 0 max(16px,env(safe-area-inset-left,0px))}
.brand{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.brand img{height:40px;width:auto;border-radius:4px;background:#fff;padding:3px}
.brand .org{font-size:13px;color:var(--band-muted)}
.brand h1{font-size:26px;line-height:1.05;color:var(--band-ink)}
.brand .spacer{flex:1}
.filechip{font-size:13px;color:var(--band-muted);line-height:1.3}
.band h1 .ver{font-family:var(--f-body,inherit);font-size:13px;font-weight:600;letter-spacing:.02em;color:var(--band-muted);background:rgba(255,255,255,.1);border-radius:999px;padding:2px 8px;vertical-align:middle;margin-left:6px}
table.cq .h-turn th{position:relative}
table.cq .rz{position:absolute;top:0;right:-4px;width:8px;height:100%;cursor:col-resize;z-index:2}
table.cq .rz::after{content:'';position:absolute;left:3px;top:20%;height:60%;width:2px;border-radius:1px;background:transparent}
table.cq .h-turn th:hover .rz::after,table.cq .rz.on::after{background:var(--accent)}
body.resizing{cursor:col-resize;user-select:none}
table.cq .h-tot{background:var(--band);color:var(--band-ink);font:600 12px var(--f-body);text-align:center;vertical-align:middle;border-left:1px solid #ffffff30}
table.cq td.tot-c{text-align:center;font-weight:700;border-bottom:1px solid var(--line);border-left:1px solid var(--line-2);background:var(--surface-2);vertical-align:middle;font-size:calc(14px * var(--cqz,1))}
table.cq tr.tot-row td{text-align:center;font-size:13px;padding:6px 2px;border-bottom:1px solid var(--line-2);border-left:1px solid var(--line-2);background:var(--surface-2)}
table.cq tr.tot-row td.has-gap b{color:var(--warn)} table.cq tr.tot-row td.all-ok{color:var(--vs)}
table.cq td.cell.drop{box-shadow:inset 0 0 0 2px var(--accent);background:var(--accent-soft)}
table.cq .nm[draggable="true"]{cursor:grab}
.ctxmenu{position:fixed;z-index:60;background:var(--surface);border:1px solid var(--line-2);border-radius:10px;box-shadow:0 10px 30px #0003;padding:6px;min-width:210px;display:flex;flex-direction:column}
.ctxmenu button{all:unset;cursor:pointer;padding:7px 12px;border-radius:6px;font-size:14px}
.ctxmenu button:hover,.ctxmenu button:focus-visible{background:var(--accent-soft)}
.ctxmenu hr{border:0;border-top:1px solid var(--line);margin:4px 0}
.ctxmenu .cm-h{font-size:12px;color:var(--muted);padding:4px 12px}
.pcard{position:fixed;z-index:70;background:var(--surface);border:1px solid var(--line-2);border-radius:10px;box-shadow:0 10px 30px #0003;padding:10px 12px;font-size:13px;min-width:220px;pointer-events:none}
.pcard b.pn{display:block;font-size:15px}
.pcard .pr{display:flex;justify-content:space-between;gap:14px;margin-top:3px}
.pcard .warn{color:var(--warn);font-weight:700} .pcard .crit{color:var(--crit);font-weight:700}
#nav .nav-help{margin-left:auto}
.help-layout{display:grid;grid-template-columns:230px 1fr;gap:22px;align-items:start}
.help-toc{position:sticky;top:calc(var(--bandh,100px) + 14px);display:flex;flex-direction:column;gap:2px;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:8px}
.help-toc a{color:var(--ink);text-decoration:none;padding:6px 10px;border-radius:6px;font-size:14px}
.help-toc a:hover{background:var(--accent-soft)} .help-toc a.dim{opacity:.35}
.help-body{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:8px 26px 26px;max-width:980px}
.hsec{padding-top:14px;scroll-margin-top:calc(var(--bandh,100px) + 14px)}
.hsec h3{font-size:22px;margin:10px 0 8px;padding-bottom:6px;border-bottom:2px solid var(--accent)}
.hsec h4{font-size:15px;margin:14px 0 4px;color:var(--accent)}
.hsec p,.hsec li{font-size:15px;line-height:1.55} .hsec ul{padding-left:22px;margin:6px 0}
.hsec table.t{margin:6px 0 10px} .hsec table.t td{white-space:normal}
.hbox{background:var(--accent-soft);border-left:4px solid var(--accent);padding:10px 14px;border-radius:6px;margin:10px 0;font-size:15px}
kbd{font:600 12px var(--f-body);background:var(--surface-2);border:1px solid var(--line-2);border-bottom-width:2px;border-radius:4px;padding:1px 6px;white-space:nowrap}
@media (max-width:820px){.help-layout{grid-template-columns:1fr}.help-toc{position:static}}
.manual .m-cover{break-after:page;padding-top:60mm}
.manual .m-org{font-size:14px;color:var(--muted);text-transform:uppercase;letter-spacing:.1em}
.manual .m-cover h1{font:700 40px/1.1 var(--f-cond);margin:6px 0 4px;color:var(--band)}
.manual .m-sub{font-size:18px} .manual .m-ver{margin-top:8px;color:var(--accent);font-weight:700;padding-bottom:16px;border-bottom:3px solid var(--accent)}
.manual .m-cover h2{margin-top:30px;font-size:18px}
.manual .m-toc{font-size:14px;line-height:1.9;padding-left:0;list-style:none}
.manual .hsec{break-inside:auto;padding-top:10px} .manual .hsec h3{break-after:avoid;font-size:23px;margin-top:14px}
.manual .hsec h4{break-after:avoid;font-size:16px;margin-top:12px} .manual .hsec li,.manual .hsec p{font-size:14.5px;line-height:1.5} .manual .hsec li{margin-bottom:3px} .manual .hbox{font-size:14.5px}
.manual table.t{font-size:13.5px;width:100%;table-layout:auto} .manual table.t td,.manual table.t th{padding:5px 8px;font-size:13.5px;white-space:normal;overflow:visible;text-overflow:clip;max-width:none} .manual table.hv td:first-child{width:60px;white-space:nowrap} .manual table.t th{position:static}
.manual table.t tr{break-inside:avoid} .manual kbd{font-size:12px}
.manual .m-toc li{font-size:16px} .manual .m-cover h1{font-size:48px}
.tb-main,.tb-view{gap:8px}
.tb-view{margin-top:-8px;padding:6px 8px;background:var(--surface);border:1px solid var(--line);border-radius:8px}
.tb-view .btn.sm{padding:5px 10px}
select.wsel{font-weight:700;min-width:250px}
table.cq .corner{padding:0 4px;vertical-align:middle}
.cstep{display:flex;align-items:center;justify-content:space-between;gap:2px;color:var(--band-ink)}
.cstep button{all:unset;cursor:pointer;width:26px;height:34px;display:grid;place-items:center;border-radius:6px;color:var(--band-ink)}
.cstep button:hover{background:#ffffff22} .cstep button:disabled{opacity:.3;cursor:default}
.cstep button svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:2.2}
.cstep .cs-l{text-align:center;line-height:1.15;min-width:0} .cstep .cs-l b{display:block;font:700 15px var(--f-cond);white-space:nowrap} .cstep .cs-l small{font-size:10.5px;opacity:.8;white-space:nowrap}
.pdf-strip{display:flex;flex-wrap:wrap;align-items:center;gap:6px 8px;margin:-4px 0 12px;font-size:13px}
.pdf-strip .ps-l{color:var(--muted)}
.pchip{font:inherit;font-size:12.5px;font-weight:600;border-radius:999px;padding:3px 10px;cursor:pointer;border:1px solid var(--line)}
.pchip.ok{background:var(--vs-bg);color:var(--vs);border-color:transparent}
.pchip.miss{background:var(--warn-bg);color:var(--warn);border-color:transparent}
.pdf-strip .ps-all{flex-basis:100%}
.pdf-strip .ps-all summary{cursor:pointer;color:var(--accent);font-weight:600;width:max-content}
.pdf-strip .ps-all .tbl-wrap{margin-top:6px;max-width:none;overflow:visible}
.pdf-strip .ps-all table.t{width:100%;table-layout:auto}
.pdf-strip .ps-all table.t th,.pdf-strip .ps-all table.t td{white-space:normal;padding:6px 8px}
.pdf-strip .ps-all table.t td.name{word-break:break-word;min-width:160px}
.pdf-strip .ps-all table.t td.nowrap{white-space:nowrap}
.pdf-strip a{color:var(--accent);font-weight:600}
.pdf-strip .ps-f{display:inline-flex;align-items:center;gap:8px;margin-left:auto}
.save-st{font-size:13px;font-weight:600;padding:6px 10px;border-radius:999px;background:rgba(255,255,255,.08);color:var(--band-ink);white-space:nowrap}
.save-st.ok{color:#9fe0b8}.save-st.busy{color:var(--band-muted)}.save-st.warn{color:#ffd58a}.save-st.err{color:#ffb4b4;background:rgba(220,60,60,.18)}
.filechip b{color:var(--band-ink);font-weight:600}
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line-2);background:var(--surface);color:var(--ink);padding:7px 12px;border-radius:var(--r);cursor:pointer;font-weight:600;font-size:14px;white-space:nowrap;text-decoration:none}
.btn:hover{border-color:var(--accent)}
.btn:disabled{opacity:.45;cursor:default}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.06)}
.btn.ghost{background:transparent;border-color:transparent}
.btn.ghost:hover{border-color:var(--line-2)}
.btn.danger{color:var(--crit)}
.btn.sm{padding:4px 9px;font-size:13px}
.band .btn{background:transparent;color:var(--band-ink);border-color:#ffffff40}
.band .btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
.badge{display:inline-block;background:var(--crit);color:#fff;border-radius:99px;font-size:12px;line-height:18px;padding:0 7px;font-weight:700}
.nav{display:flex;gap:2px;margin-top:10px;overflow-x:auto;scrollbar-width:none}
.nav button{background:none;border:0;color:var(--band-muted);padding:9px 14px 10px;font:600 15px var(--f-body);cursor:pointer;border-radius:6px 6px 0 0;white-space:nowrap}
.nav button:hover{color:var(--band-ink)}
.nav button[aria-current="page"]{background:var(--bg);color:var(--ink)}

/* estructura */
main{max-width:1480px;margin:0 auto;padding-block:20px 60px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
main.wide{max-width:none}
.view{display:flex;flex-direction:column;gap:18px}
.toolbar{display:flex;flex-wrap:wrap;align-items:center;gap:10px}
.toolbar .grow{flex:1}
.stepper{display:inline-flex;align-items:center;border:1px solid var(--line-2);border-radius:var(--r);background:var(--surface);overflow:hidden}
.stepper button{border:0;background:none;padding:7px 10px;cursor:pointer;display:flex;align-items:center}
.stepper button:hover{background:var(--surface-2)}
.stepper button:disabled{opacity:.3;cursor:default}
.stepper svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.stepper .lbl{padding:0 12px;font-family:var(--f-cond);font-size:19px;font-weight:600;min-width:12ch;text-align:center}
.stepper .lbl small{display:block;font:12px var(--f-body);color:var(--muted);margin-top:-3px}
select,input[type=text],input[type=number],input[type=search],input[type=date],textarea{border:1px solid var(--line-2);background:var(--surface);border-radius:var(--r);padding:7px 10px;min-width:0}
.seg{display:inline-flex;border:1px solid var(--line-2);border-radius:var(--r);overflow:hidden;background:var(--surface);flex-wrap:wrap}
.seg button{border:0;background:none;padding:7px 12px;cursor:pointer;font-weight:600;font-size:14px;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--band);color:var(--band-ink)}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:16px 18px;min-width:0}
.panel h2{font-size:21px;margin-bottom:10px}
.panel h2 small{font:500 13px var(--f-body);color:var(--muted);margin-left:8px}
.cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:18px}
.cols-2-1{display:grid;grid-template-columns:minmax(0,2fr) minmax(0,1fr);gap:18px}
@media (max-width:980px){.cols-2-1{grid-template-columns:1fr}}
.muted{color:var(--muted)} .small{font-size:13px}
.banner{padding:10px 14px;border-radius:8px;background:var(--info-bg);color:var(--info);font-size:14px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.banner.warn{background:var(--warn-bg);color:var(--warn)}
.banner.ok{background:var(--vs-bg);color:var(--vs)}
.banner .grow{flex:1}
.hours td{padding:3px 3px!important}
.hours th{font-size:11px!important;padding:5px 4px!important}
.hin::placeholder{color:var(--line-2)}
dialog.dlg:has(.hours){max-width:min(1440px,98vw)}
.hin{width:62px;padding:4px 5px!important;font-size:13px;text-align:center}
.hin.sp{background:var(--special-bg);color:var(--special);font-weight:700;border-color:var(--special)}
.hin.bad{border-color:var(--crit);background:var(--crit-bg);color:var(--crit)}
.editbar{position:sticky;top:calc(var(--bandh,100px) + 6px);z-index:15;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:8px 10px;box-shadow:0 -7px 0 var(--bg),0 4px 14px #0000001a}

/* indicadores */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px}
.kpi{border-radius:8px;padding:12px 14px;background:var(--surface);border:1px solid var(--line);min-width:0}
.kpi .k-lab{font-size:13px;color:var(--muted)}
.kpi .k-val{font:600 32px/1.05 var(--f-cond);margin-top:4px;font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.kpi .k-sub{font-size:12px;color:var(--muted)}
.kpi.coord{background:var(--coord-bg);border-color:transparent}.kpi.coord .k-val,.kpi.coord .k-lab{color:var(--coord)}
.kpi.vs{background:var(--vs-bg);border-color:transparent}.kpi.vs .k-val,.kpi.vs .k-lab{color:var(--vs)}
.kpi.warn{background:var(--warn-bg);border-color:transparent}.kpi.warn .k-val,.kpi.warn .k-lab{color:var(--warn)}
.kpi.crit{background:var(--crit-bg);border-color:transparent}.kpi.crit .k-val,.kpi.crit .k-lab{color:var(--crit)}
.kpi.acc .k-val{color:var(--accent)}
.kpis-sm .kpi .k-val{font-size:22px}
.prog{height:10px;border-radius:5px;background:var(--line);overflow:hidden;margin-top:8px}
.prog i{display:block;height:100%;background:var(--accent)}

/* chips */
.chip{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:600;padding:2px 8px;border-radius:99px;background:var(--surface-2);color:var(--muted);border:1px solid var(--line);white-space:nowrap}
.chip.crit{background:var(--crit-bg);color:var(--crit);border-color:transparent}
.chip.warn{background:var(--warn-bg);color:var(--warn);border-color:transparent}
.chip.info{background:var(--info-bg);color:var(--info);border-color:transparent}
.chip.coord{background:var(--coord-bg);color:var(--coord);border-color:transparent}
.chip.vs{background:var(--vs-bg);color:var(--vs);border-color:transparent}
.chip.ok{background:var(--vs-bg);color:var(--vs);border-color:transparent}

/* tablas */
.tbl-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:8px;background:var(--surface)}
table.t{border-collapse:collapse;width:100%;font-size:14px}
table.t th{background:var(--band);color:var(--band-ink);font:600 13px var(--f-body);padding:8px 10px;text-align:left;white-space:nowrap;position:sticky;top:0}
table.t th.n,table.t td.n{text-align:right}
table.t th.c,table.t td.c{text-align:center}
table.t td{padding:6px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
table.t td.wrap{white-space:normal;min-width:200px}
table.t tbody tr:nth-child(even) td{background:var(--surface-2)}
table.t tfoot td{font-weight:700;border-top:2px solid var(--band);background:var(--surface)}
table.t td.name{font-weight:600}
table.t th.sortable{cursor:pointer}
table.t th.sortable:hover{text-decoration:underline}
table.t input{padding:4px 6px;width:100%;min-width:70px}
.pos{color:var(--special);font-weight:700}.neg{color:var(--info);font-weight:700}
.bar{height:8px;border-radius:4px;background:var(--line);overflow:hidden;display:flex;min-width:60px}
.bar i{display:block;height:100%}
.bar i.c{background:var(--coord)}.bar i.v{background:var(--vs)}

/* alertas */
.alerts{display:flex;flex-direction:column}
.alert{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;padding:8px 2px;border-bottom:1px solid var(--line)}
.alert:last-child{border-bottom:0}
.alert .who{font-weight:600}
.alert .det{font-size:13px;color:var(--muted)}
.sev{width:8px;height:32px;border-radius:3px;background:var(--line-2)}
.sev.crit{background:var(--crit)}.sev.warn{background:var(--warn)}.sev.info{background:var(--info)}
.empty-note{padding:16px;color:var(--muted);text-align:center}

/* cobertura del día */
.daypick{display:flex;gap:4px;flex-wrap:wrap}
.daypick button{border:1px solid var(--line-2);background:var(--surface);border-radius:var(--r);padding:4px 9px;cursor:pointer;font-size:13px;font-weight:600}
.daypick button[aria-pressed="true"]{background:var(--band);color:var(--band-ink);border-color:var(--band)}
.daypick button.today{box-shadow:inset 0 -3px 0 var(--accent)}
.cover{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:8px;margin-top:12px}
.cover .c-item{border:1px solid var(--line);border-radius:6px;padding:8px 10px;display:grid;grid-template-columns:1fr auto;gap:2px 8px;background:var(--surface-2)}
.cover .c-p{font-weight:700;font-size:14px}
.cover .c-id,.cover .c-h{font-size:12px;color:var(--muted);text-align:right}
.cover .c-n{font-size:13px}
.cover .c-n b{font-weight:700}
.cover .c-n.coord b{color:var(--coord)}.cover .c-n.vs b{color:var(--vs)}
.cover .q{color:var(--warn);background:var(--warn-bg);padding:0 4px;border-radius:3px}

/* cuadrante */
.grid-wrap{overflow-x:auto;border-radius:8px;border:1px solid var(--line);background:var(--surface)}
table.cq{border-collapse:separate;border-spacing:0;width:100%;min-width:1100px;font-size:13px;table-layout:fixed}
table.cq th,table.cq td{padding:0}
table.cq .h-day{background:var(--band);color:var(--band-ink);text-align:left;padding:6px 10px;border-left:1px solid #ffffff30}
table.cq .h-day.we{background:var(--band-2)}
table.cq .h-day.today{background:var(--accent);color:var(--accent-ink)}
table.cq .h-day .dn{font:500 15px var(--f-body)}
table.cq .h-day .dd{font:700 28px/1 var(--f-cond);float:right}
table.cq .h-fest td{font:italic 600 11px var(--f-body);color:var(--crit);text-align:center;padding:2px;border-left:1px solid var(--line)}
table.cq .h-turn th{background:var(--surface-2);color:var(--muted);font:500 11px var(--f-body);padding:4px;border-bottom:1px solid var(--line-2);border-left:1px solid var(--line)}
table.cq .h-turn th:first-child{text-align:left;padding-left:12px;position:sticky;left:0;z-index:3}
table.cq .corner{position:sticky;left:0;z-index:3;background:var(--band);width:150px}
table.cq td.pst{position:sticky;left:0;z-index:1;background:var(--surface-2);padding:6px 10px 6px 12px;border-bottom:1px solid var(--line);vertical-align:top;width:150px}
table.cq td.pst b{display:block;font-size:13px;color:var(--ink)}
table.cq td.pst span{font-size:11px;color:var(--muted)}
table.cq td.cell{text-align:center;border-bottom:1px solid var(--line);vertical-align:top;padding:4px 2px 6px}
table.cq td.cell.first{border-left:1px solid var(--line-2)}
table.cq td.cell .hr{display:block;font-size:calc(14px * var(--cqz,1));color:var(--muted);min-height:18px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
table.cq td.cell .hr.special{color:var(--special);font-weight:700;font-style:italic}
table.cq td.cell .nm{display:inline-block;font-weight:700;font-size:calc(16px * var(--cqz,1));padding:1px 5px;border-radius:4px;cursor:pointer;min-height:22px;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
table.cq td.cell .nm.coord{color:var(--coord)}
table.cq td.cell .nm.vs{color:var(--vs)}
table.cq td.cell .nm.none{color:var(--line-2);font-weight:400;cursor:default}
table.cq td.cell .nm.q{background:var(--warn-bg);color:var(--warn)}
table.cq td.cell .nm.dup{background:var(--crit-bg);color:var(--crit)}
table.cq td.cell .nm.abs{background:var(--crit-bg);color:var(--crit);text-decoration:line-through}
table.cq td.cell .nm.unk{background:var(--info-bg);color:var(--info);font-style:italic}
table.cq tbody tr.r-coord td.pst{background:var(--coord-bg);box-shadow:inset 5px 0 0 var(--coord)}
table.cq tbody tr.r-coord td.pst b{color:var(--coord)}
table.cq tbody tr.r-vs td.pst{box-shadow:inset 5px 0 0 var(--vs)}
table.cq tbody tr.r-coord td.cell{background-image:linear-gradient(var(--coord-bg),var(--coord-bg));background-size:100% 3px;background-repeat:no-repeat}
table.cq thead tr > th,table.cq thead tr > td,table.cq thead .h-turn th,table.cq thead .h-fest td{position:sticky;z-index:4}
table.cq thead .corner,table.cq thead .h-turn th:first-child,table.cq thead .h-fest td:first-child{left:0;z-index:6}
table.cq thead .h-fest td{background:var(--surface)}
.grid-wrap.stick{overflow:visible}
.grid-wrap.scrolly{overflow:auto}
table.cq td.cell .nm.gap{min-width:40px}
table.cq td.cell.empty{background:var(--vanilla)}
table.cq.editing{user-select:none}
table.cq td.cell.sel,table.cq.editing td.cell.sel:hover{background:var(--sel-bg);box-shadow:inset 0 0 0 2px var(--sel)}
.selbar{position:fixed;left:0;right:0;margin:0 auto;width:max-content;bottom:16px;z-index:50;display:flex;flex-wrap:wrap;align-items:center;gap:6px;max-width:calc(100vw - 32px);background:var(--surface);border:1px solid var(--line-2);border-radius:12px;box-shadow:0 10px 30px #0003;padding:8px 10px}
.selbar .sb-n{font-weight:700;margin-right:6px;white-space:nowrap}
.selbar .btn{padding:5px 9px;font-size:13px}
.selbar .sb-sep{width:1px;align-self:stretch;background:var(--line);margin:0 2px}
table.cq td.cell.fest{background:var(--fest-bg)}
table.cq td.cell.closed{background:repeating-linear-gradient(135deg,var(--surface-2) 0 6px,var(--line) 6px 7px);vertical-align:middle}
table.cq td.cell.closed .nm.cl{color:var(--muted);font-weight:700;letter-spacing:.08em;text-transform:uppercase;font-size:11px;background:var(--surface);border:1px solid var(--line-2)}
table.cq td.cell.closed .hr{color:var(--muted);font-style:italic}
.cl-tag{display:inline-block;font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);border:1px solid var(--line-2);border-radius:4px;padding:1px 6px;background:var(--surface-2)}
.lg.cl-lg{background:repeating-linear-gradient(135deg,var(--surface-2) 0 5px,var(--line) 5px 6px);color:var(--muted)}
.cover .c-item.closed{opacity:.75;background:repeating-linear-gradient(135deg,var(--surface-2) 0 6px,var(--line) 6px 7px)}
.cz-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:2px 12px;max-height:34vh;overflow:auto;padding:4px 0}
.cz-grid .cz-has{font-weight:700}
.cz-day{display:inline-flex;align-items:center;gap:4px;border:1px solid var(--line);border-radius:6px;padding:4px 8px;font-size:13px;cursor:pointer}
.cz-day:has(input:checked){background:var(--accent-soft);border-color:var(--accent)}
table.cq.hl td.cell .nm:not(.hit){opacity:.28}
table.cq td.cell .nm.hit{outline:2px solid var(--accent);background:var(--accent-soft)}
table.cq td.cell.chg{box-shadow:inset 0 0 0 2px var(--accent);background:var(--accent-soft)}
table.cq td.cell.auto .nm{outline:2px dashed var(--accent);outline-offset:1px}
table.cq.editing td.cell{cursor:pointer}
table.cq.editing td.cell:hover{background:var(--accent-soft)}
table.cq.editing td.cell .nm.none{cursor:pointer}
table.cq tr.abs-row td{background:var(--fest-bg);font-size:11px;color:var(--crit);font-style:italic;padding:5px 6px;border-left:1px solid var(--line);text-align:center}
table.cq tr.abs-row td.pst{font-style:normal;font-weight:700}
.legend{display:flex;flex-wrap:wrap;gap:8px;align-items:center;font-size:12px;color:var(--muted)}
.legend .lg{padding:2px 8px;border-radius:4px;font-weight:600}
.obs{border-top:1px solid var(--line);padding-top:8px;font-size:13px}
.obs-edit{display:grid;gap:6px}
.obs-edit input{width:100%}

/* ficha */
.ficha{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:22px 24px}
.ficha .f-head{display:flex;justify-content:space-between;gap:12px;align-items:flex-end;border-bottom:3px solid var(--accent);padding-bottom:10px;margin-bottom:12px;flex-wrap:wrap}
.ficha .f-name{font:700 40px/1 var(--f-cond)}
.ficha .f-sub{color:var(--muted);font-size:14px;margin-top:4px}
.ficha .f-week{text-align:right;font-family:var(--f-cond)}
.ficha .f-week b{display:block;font-size:30px;color:var(--accent);line-height:1}
.ficha table{width:100%;border-collapse:collapse;font-size:15px}
.ficha th{text-align:left;font:600 12px var(--f-body);color:var(--muted);border-bottom:1px solid var(--line-2);padding:6px 8px}
.ficha td{padding:10px 8px;border-bottom:1px solid var(--line)}
.ficha td.d{font-weight:700;width:110px}
.ficha tr.off td{color:var(--muted)}
.ficha tr.work td{background:var(--surface-2)}
.ficha .tot{display:flex;justify-content:flex-end;gap:16px;align-items:baseline;margin-top:12px}
.ficha .tot b{font:700 32px var(--f-cond);color:var(--accent)}
.ficha .note{font-size:12px;color:var(--crit);font-style:italic}

/* personas */
.plist{display:flex;flex-direction:column;max-height:70vh;overflow:auto;border:1px solid var(--line);border-radius:8px;background:var(--surface)}
.plist button{display:grid;grid-template-columns:1fr auto;gap:2px 10px;text-align:left;background:none;border:0;border-bottom:1px solid var(--line);padding:8px 12px;cursor:pointer}
.plist button:hover{background:var(--surface-2)}
.plist button[aria-current="true"]{background:var(--accent-soft);box-shadow:inset 3px 0 0 var(--accent)}
.plist .pn{font-weight:700}.plist .ph{font-variant-numeric:tabular-nums;font-weight:600}.plist .ps{font-size:12px;color:var(--muted)}
.layout-p{display:grid;grid-template-columns:300px minmax(0,1fr);gap:18px;align-items:start}
@media (max-width:900px){.layout-p{grid-template-columns:1fr}.plist{max-height:260px}}

/* calendarios */
.cal-wrap{overflow-x:auto}
table.cal{border-collapse:separate;border-spacing:2px;font-size:11px}
table.cal th{color:var(--muted);font-weight:600;padding:0 2px;text-align:center}
table.cal td{min-width:26px;height:26px;text-align:center;border-radius:3px;padding:0 1px;font-weight:700;white-space:nowrap}
table.cal td.rowh{text-align:left;padding-right:10px;font-weight:600;color:var(--ink);background:none!important}
table.cal td.we{background:var(--surface-2)}
table.cal td.w-c{background:var(--coord-bg);color:var(--coord)}
table.cal td.w-v{background:var(--vs-bg);color:var(--vs)}
table.cal td.ab{background:var(--crit-bg);color:var(--crit)}
table.cal td.fe{box-shadow:inset 0 0 0 1.5px var(--crit)}
table.cal td.nd{background:repeating-linear-gradient(45deg,transparent 0 3px,var(--line) 3px 4px)}
table.cal td.td{outline:2px solid var(--accent)}
table.cal td.x{visibility:hidden}
table.cal td.click{cursor:pointer}
table.cal td.click:hover{outline:2px solid var(--line-2)}
table.cal th.td{color:var(--accent)}

/* gráficos */
svg.chart{width:100%;height:auto;display:block}
svg.chart text{fill:var(--muted);font:15px var(--f-body)}
svg.chart .gl{stroke:var(--line);stroke-width:1}
svg.chart .bc{fill:var(--coord)}svg.chart .bv{fill:var(--vs)}svg.chart .ba{fill:var(--accent)}svg.chart .bl{fill:var(--line-2)}
svg.chart .tv{fill:var(--ink);font-weight:600}
.keys{display:flex;gap:14px;font-size:13px;color:var(--muted);flex-wrap:wrap}
.keys i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px;vertical-align:-1px}

/* informes */
.reports{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:10px}
.rcard{text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:12px 14px;cursor:pointer;display:flex;flex-direction:column;gap:4px}
.rcard:hover{border-color:var(--accent)}
.rcard[aria-pressed="true"]{border-color:var(--accent);box-shadow:inset 0 -3px 0 var(--accent)}
.rcard b{font:600 18px var(--f-cond)}
.rcard span{font-size:13px;color:var(--muted)}
.rcard em{font-style:normal;font-size:12px;color:var(--accent);font-weight:700}
.doc{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:24px}
.doc-head{display:flex;justify-content:space-between;gap:16px;align-items:flex-end;border-bottom:3px solid var(--accent);padding-bottom:10px;margin-bottom:16px;flex-wrap:wrap}
.doc-head .dh-org{display:flex;gap:12px;align-items:center}
.doc-head img{height:44px}
.doc-head h2{font-size:30px;margin:0}
.doc-head .dh-sub{color:var(--muted);font-size:14px}
.doc-head .dh-per{font:700 22px var(--f-cond);color:var(--accent);text-align:right}
.doc-head .dh-upd{font:400 11.5px var(--f-body);color:#6B7280;margin-right:12px;letter-spacing:0;vertical-align:3px;white-space:nowrap}
.doc h3{font-size:19px;margin:18px 0 8px}
.doc-foot{margin-top:24px;display:flex;justify-content:space-between;gap:20px;font-size:12px;color:var(--muted);flex-wrap:wrap}
.sign{min-width:220px;border-top:1px solid var(--line-2);padding-top:6px;text-align:center}
.heat td.hv{text-align:center;font-variant-numeric:tabular-nums}

/* formularios y diálogos */
.form{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:18px}
.field{display:flex;flex-direction:column;gap:4px;margin-bottom:10px}
.field label,.flabel{font-weight:600;font-size:14px}
.field .hint,.hint{font-size:12px;color:var(--muted)}
.field input[type=text],.field input[type=number],.field input[type=date],.field select,.field textarea{width:100%}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media (max-width:560px){.grid2{grid-template-columns:1fr}}
.swatch{width:34px;height:34px;border-radius:50%;border:3px solid var(--surface);box-shadow:0 0 0 1px var(--line-2);cursor:pointer}
.swatch[aria-pressed="true"]{box-shadow:0 0 0 2px var(--ink)}
.logo-prev{height:56px;border:1px dashed var(--line-2);border-radius:6px;padding:4px;background:#fff}
dialog.dlg{border:0;border-radius:12px;padding:0;max-width:min(720px,94vw);width:100%;background:var(--surface);color:var(--ink);box-shadow:0 20px 60px #0006}
dialog.dlg.wide{max-width:min(1000px,96vw)}
dialog.dlg::backdrop{background:#0b1220a8}
dialog.dlg form{padding:20px 22px 0;display:flex;flex-direction:column;gap:12px;max-height:88vh;overflow:auto}
dialog.dlg h2{font-size:25px}
.dlg-sub{color:var(--muted);font-size:14px;margin-top:-8px}
.dlg-act{display:flex;justify-content:flex-end;gap:8px;flex-wrap:wrap;position:sticky;bottom:0;background:var(--surface);padding:12px 0 18px;border-top:1px solid var(--line)}
.dlg-act .grow{flex:1}
.sugg{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:6px}
.sugg button{display:grid;grid-template-columns:1fr auto;gap:2px 8px;text-align:left;border:1px solid var(--line);background:var(--surface-2);border-radius:6px;padding:7px 10px;cursor:pointer}
.sugg button:hover,.sugg button[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft)}
.sugg .sn{font-weight:700}.sugg .ss{font-size:12px;color:var(--muted);text-align:right}.sugg .sr{font-size:12px;color:var(--muted);grid-column:1/-1}
details.excl summary{cursor:pointer;font-size:13px;color:var(--muted)}
details.excl ul{margin:6px 0 0;padding-left:18px;font-size:13px;color:var(--muted)}
iframe.preview{width:390px;max-width:100%;height:640px;border:8px solid var(--band);border-radius:26px;background:#fff;display:block;margin:0 auto}

/* bienvenida */
.drop{border:2px dashed var(--line-2);border-radius:12px;padding:40px 20px;text-align:center;background:var(--surface);display:flex;flex-direction:column;gap:12px;align-items:center}
.drop.over{border-color:var(--accent);background:var(--accent-soft)}
.drop h2{font-size:30px}
.drop p{max-width:62ch;margin:0;color:var(--muted)}
.steps{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}
.steps div{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:12px 14px;font-size:14px}
.steps b{display:block;font:600 18px var(--f-cond);margin-bottom:2px}

.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--band);color:var(--band-ink);padding:10px 16px;border-radius:8px;font-weight:600;z-index:100;box-shadow:0 6px 24px #0004;max-width:90vw}
body:has(#selbar) .toast{bottom:calc(110px + env(safe-area-inset-bottom,0px))}
#print-zone{display:none}

/* impresión */
@page{size:A4 portrait;margin:11mm}
@page land{size:A4 landscape;margin:7mm}
@media print{
  :root{--bg:#fff;--surface:#fff;--surface-2:#F5F6F8;--ink:#111;--muted:#555;--line:#D5DAE1;--line-2:#B9C1CC;--band:#22324A;--band-2:#3A4E6B;--band-ink:#fff;--accent:#B8893A;--accent-soft:#F4EAD6;--accent-ink:#fff;--coord:#24527A;--coord-bg:#E3EBF4;--vs:#2F7A5F;--vs-bg:#E3F1EA;--warn:#8A5300;--warn-bg:#FCE7B2;--crit:#9B1C1C;--crit-bg:#FBE3E3;--info:#2E5AAC;--info-bg:#E6ECF7;--fest-bg:#FBEFEF;--special:#B4541A;--special-bg:#FDF1E3;color-scheme:light}
  /* sin degradados, sombras ni transparencias: algunos lectores e impresoras (Acrobat) no pueden imprimir esos efectos */
  *,*::before,*::after{background-image:none!important;box-shadow:none!important;text-shadow:none!important;filter:none!important;opacity:1!important}
  table.cq tbody tr.r-coord td.pst{border-left:5px solid var(--coord)!important}
  table.cq tbody tr.r-vs td.pst{border-left:5px solid var(--vs)!important}
  table.cq tbody tr.r-coord td.cell{border-top:2px solid var(--coord-bg)}
  table.cq td.cell.closed{background:#ECEBE7!important}
  .lg.cl-lg{background:#ECEBE7!important}
  table.cq .h-day,table.cq .h-tot{border-left-color:#5A6A82!important}
  :root{--f-body:Arial, "Liberation Sans", Helvetica, sans-serif;--f-cond:"Arial Narrow", "Liberation Sans Narrow", Arial, sans-serif}
  body{background:#fff;font-size:12px;font-family:var(--f-body)}
  body.printing > *:not(#print-zone){display:none!important}
  body.printing #print-zone{display:block}
  *{-webkit-print-color-adjust:exact;print-color-adjust:exact}
  .land{page:land;zoom:.8}
  .land .doc-head{margin-bottom:6px;padding-bottom:4px}
  .land .doc-head h2{font-size:22px}
  .land table.cq td.cell{padding:1px 1px 2px}
  .land table.cq td.pst{padding:2px 6px}
  .land table.cq td.pst b{display:inline}
  .land table.cq td.pst span{margin-left:4px}
  .land table.cq .h-day{padding:3px 6px}
  .pb{break-after:page}
  .doc,.ficha,.panel,.grid-wrap,.tbl-wrap{border:0;padding:0;border-radius:0}
  .tbl-wrap,.grid-wrap,.cal-wrap{overflow:visible}
  table.t th{position:static}
  table.cq thead tr > th,table.cq thead tr > td,table.cq td.pst{position:static!important}
  .port{zoom:.9} .port table.cq td.cell .nm{font-size:8.5px} .port table.cq td.cell .hr{font-size:7.5px} .port table.cq td.pst{width:80px}
  table.cq{min-width:0;font-size:9.5px}
  table.cq td.cell .nm{font-size:10px;padding:0 2px}
  table.cq td.cell .hr{font-size:8.5px;min-height:11px}
  table.cq .h-day .dd{font-size:20px}
  table.cq .h-day .dn{font-size:12px}
  table.cq td.pst{width:105px}
  table.cq.hl td.cell .nm:not(.hit){opacity:1}
  table.cq td.cell.chg,table.cq td.cell.auto .nm{box-shadow:none;outline:0;background:inherit}
  table.t{font-size:11px} table.t td{padding:3px 6px} table.t th{padding:5px 6px}
  .ficha{page-break-inside:avoid}
  .no-print{display:none!important}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

/* ---------- edición a pantalla completa ---------- */
body.cq-full .band{display:none}
body.cq-full main{padding:0 10px 40px}
body.cq-full.dock-left .ed-lay{padding-left:var(--dockw,180px)}body.cq-full.dock-right .ed-main{padding-right:var(--dockw,180px)}
.edslim{position:sticky;top:0;z-index:25;display:flex;align-items:center;gap:6px;background:var(--band);color:var(--band-ink);margin:0 -10px 2px;padding:7px 12px;border-bottom:3px solid var(--accent);min-height:52px;box-sizing:border-box}

:root[data-theme="dark"]{--menu-bg:#1F2A38}
:root[data-pal="pizarra"]{--bg:#E2E7EE;--surface:#F4F6F9;--surface-2:#EAEEF3;--line:#D0D7E1;--line-2:#BAC3D0;--menu-bg:#E9EDF3;--menu-hover:#DCE3EC;--band:#22324A;--band-2:#3A4E6B;--accent-soft:#F0E5D0}
:root[data-pal="museo"]{--bg:#EFE7E0;--surface:#FAF6F2;--surface-2:#F3ECE5;--line:#E0D4CA;--line-2:#CDBCAE;--menu-bg:#F3EAE3;--menu-hover:#EADBD2;--band:#5A1F2B;--band-2:#7A3542;--band-muted:#DDBFC4;--accent-soft:#F3E6CE;--ink:#2A1B1E;--muted:#6E5B5E}
:root[data-pal="ria"]{--bg:#DFEAEC;--surface:#F2F7F8;--surface-2:#E7F0F1;--line:#CADBDE;--line-2:#B1C8CC;--menu-bg:#E4EFF0;--menu-hover:#D3E5E7;--band:#0F4C5C;--band-2:#1E6577;--band-muted:#A9CBD3;--accent-soft:#FBE2D2;--ink:#14272C;--muted:#506A70}
:root[data-pal="noche"]{--bg:#151B24;--surface:#1C2430;--surface-2:#212B38;--band:#0D141E;--menu-bg:#232E3C;--menu-hover:#2E3B4C;--accent-soft:#3A301A;--line:#2C3747;--line-2:#3B4859}
.ctxmenu,.dd-m,.quick{background:var(--menu-bg)!important}
.ctxmenu button:hover,.ctxmenu button:focus-visible{background:var(--menu-hover)}
/* ===== v4.3 barra del cuadrante: cinta con pestañas / botones de sección ===== */
.cqbar.rib,.cqbar.tb-a{gap:0;padding:12px 16px 0}
.cqbar.tb-a{padding-bottom:10px}
.cqbar svg.bi,.cqbar .wk svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
.rib-tabs,.tb-row{display:flex;align-items:center;gap:8px;flex-wrap:nowrap;min-width:0}
.rib-tabs>*,.tb-row>*{flex:none}
.cqbar .favs{flex:0 1 auto;min-width:46px;overflow:hidden;flex-wrap:nowrap}
.rib-body .favs{margin-left:auto;flex-wrap:wrap;overflow:visible}
.fav{flex:0 1 auto;min-width:36px;max-width:170px;overflow:hidden}
.fav .lb{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.qb{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line-2);background:var(--surface);color:var(--ink);border-radius:var(--r);padding:7px 9px;cursor:pointer;font:600 14px var(--f-body);min-height:36px}
.qb:hover{background:var(--surface-2)}
.qb svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.cqbar .vsep{width:1px;align-self:stretch;background:var(--line-2);margin:2px 4px}
.cqbar .grow{flex:1}
.cqbar .wk{display:inline-flex;align-items:center;border:1px solid var(--line-2);border-radius:var(--r);background:var(--surface);overflow:hidden}
.cqbar .wk .wsel{border:0;background:transparent;font-weight:700;font-size:14.5px;padding:7px 4px;max-width:330px;color:var(--ink)}
.cqbar .wk .ib{border:0;background:none;padding:7px 8px;cursor:pointer;color:var(--muted);display:inline-flex}
.cqbar .wk .ib:hover:not(:disabled){background:var(--surface-2);color:var(--ink)}
.cqbar .wk .ib:disabled{opacity:.35;cursor:default}
.cqbar .seg{background:var(--surface);border-color:var(--line-2)}
.rt{display:inline-flex;align-items:center;gap:6px;border:1px solid transparent;border-bottom:0;background:none;padding:8px 13px 9px;border-radius:8px 8px 0 0;font:600 14px var(--f-body);color:var(--muted);cursor:pointer;position:relative;top:1px;align-self:flex-end}
.rt:hover{color:var(--ink);background:var(--surface-2)}
.rt.on{background:var(--surface);color:var(--ink);border-color:var(--line-2);box-shadow:inset 0 3px 0 var(--accent)}
.rt em,.sb-main em,.fav em{font-style:normal;background:var(--crit);color:#fff;border-radius:9px;font-size:11px;padding:0 6px;line-height:17px;font-weight:700}
.rts{display:flex;gap:2px;align-self:flex-end;flex:none}
.rib.col .rts{align-self:center}
.rib.col .rib-tabs{padding-bottom:10px}
.rib.col .rt{align-self:center;top:0;border-radius:8px;padding:7px 12px}
.rib-tog{border:1px solid var(--line-2)!important;border-radius:var(--r);background:var(--surface)!important;padding:7px!important;cursor:pointer;color:var(--muted);display:inline-flex}
.rib-tog svg{transition:transform .15s}
.rib:not(.col) .rib-tog svg{transform:rotate(180deg)}
.rib-body{display:flex;align-items:center;gap:8px 10px;flex-wrap:wrap;background:var(--surface);border:1px solid var(--line-2);border-radius:0 8px 8px 8px;padding:9px 12px;margin:0 0 10px;min-height:54px}
.rib-body .btn{min-height:36px}
.rib-body .ckl{display:inline-flex;align-items:center;gap:6px;font-size:14px;padding:6px 10px;border:1px solid var(--line);border-radius:var(--r);background:var(--surface-2);cursor:pointer;white-space:nowrap}
.rib-body .ckl:has(input:checked){border-color:var(--accent);background:var(--accent-soft)}
.cqbar .tb-sel select{min-height:36px;max-width:240px}
.cqbar .tb-sel select.on{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent-soft)}
.cqbar .tb-zoom{display:inline-flex;align-items:center;gap:6px;font-size:13px;color:var(--muted)}
.cqbar .tb-chips{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.rib-body>.tb-chips{padding-right:8px;margin-right:4px;border-right:1px solid var(--line)}
/* botones de sección con menú (opción A) */
.sb{position:relative;display:inline-flex;border:1px solid var(--line-2);border-radius:var(--r);background:var(--surface)}
.sb>button{border:0;background:none;cursor:pointer;color:var(--ink);font:600 14px var(--f-body);display:inline-flex;align-items:center;gap:6px;min-height:36px}
.sb-main{padding:6px 10px 6px 11px;border-radius:var(--r) 0 0 var(--r)}
.sb-chev{padding:6px 7px;border-left:1px solid var(--line)!important;border-radius:0 var(--r) var(--r) 0;color:var(--muted)!important}
.sb>button:hover{background:var(--surface-2)}
.sb.open{border-color:var(--accent)}
.sb.open .sb-chev svg{transform:rotate(180deg)}
.sb.pri{border-color:transparent;background:var(--edit-c,#2F7A5F)}
.sb.pri>button{color:#fff!important}
.sb.pri .sb-chev{border-left-color:#ffffff55!important}
.sb.pri>button:hover{background:var(--edit-c2,#24614b)}
.sb.pri .sb-main em{background:#fff;color:var(--crit)}
.sb .menu{display:none;position:absolute;top:calc(100% + 6px);left:0;z-index:70;min-width:290px;max-width:min(420px,92vw);background:var(--menu-bg);color:var(--ink);border:1px solid var(--line-2);border-radius:10px;box-shadow:0 14px 34px #0003;padding:6px;flex-direction:column;gap:1px}
.sb.pri .menu{left:auto;right:0}
.sb.open .menu{display:flex}
.sb .menu .tb-sel{display:flex;flex-direction:column;gap:3px;padding:6px 8px;font-size:12px;color:var(--muted)}
.sb .menu .tb-sel select{max-width:none;width:100%}
.sb .menu .tb-zoom{padding:4px 8px}
.sb .menu .tb-chips{padding:6px 8px}
.msep{height:1px;background:var(--line);margin:4px 2px}
.mi{all:unset;box-sizing:border-box;display:flex;align-items:center;gap:9px;padding:8px 10px;border-radius:7px;cursor:pointer;font-size:14px;color:var(--ink)}
.mi:hover,.mi:focus-visible,.mi.cur{background:var(--menu-hover)}
.mi .ck{width:16px;text-align:center;font-weight:700;color:var(--accent);flex:none}
.mi .mt{flex:1;min-width:0}
.mi svg.bi{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none;color:var(--muted)}
.mi kbd,.cmdk kbd{font:600 11px var(--f-body);border:1px solid var(--line-2);border-radius:4px;padding:1px 5px;color:var(--muted);background:var(--surface)}
.mi small{color:var(--muted);font-size:12px}
.pinb{display:inline-flex;opacity:0;padding:3px;border-radius:5px;color:var(--muted)}
.mi:hover .pinb,.pinb.on{opacity:1}
.pinb.on{color:var(--accent)}
.pinb:hover{background:var(--surface)}
html.touch .pinb{opacity:.6}
/* favoritos y buscador */
.favs{display:inline-flex;gap:6px;flex-wrap:wrap;padding-left:6px;border-left:1px dashed var(--line-2)}
.fav{display:inline-flex;align-items:center;gap:6px;border:1px dashed var(--accent);background:var(--accent-soft);color:var(--ink);border-radius:var(--r);padding:6px 10px;font:600 13px var(--f-body);cursor:pointer;min-height:34px}
.fav svg{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:2}
.cmdk{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--line-2);background:var(--surface);color:var(--muted);border-radius:var(--r);padding:6px 10px;cursor:pointer;font:500 14px var(--f-body);min-height:36px}
.cmdk:hover{color:var(--ink)}
.cmdpal{position:fixed;inset:0;z-index:90;background:#0006;display:flex;justify-content:center;align-items:flex-start;padding:12vh 16px 16px}
.cp-b{width:min(620px,100%);background:var(--menu-bg);color:var(--ink);border:1px solid var(--line-2);border-radius:14px;box-shadow:0 24px 60px #0005;overflow:hidden}
.cp-in{display:flex;align-items:center;gap:10px;padding:12px 14px;border-bottom:1px solid var(--line)}
.cp-in svg,.cp-f svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:2;color:var(--muted);flex:none}
.cp-f svg{width:13px;height:13px;vertical-align:-2px}
.cp-in input{flex:1;border:0;background:transparent;font-size:17px;outline:none;color:var(--ink);padding:4px 0}
.cp-l{max-height:52vh;overflow:auto;padding:6px;display:flex;flex-direction:column}
.cp-f{padding:8px 14px;font-size:12px;color:var(--muted);border-top:1px solid var(--line)}
/* compacta y solo iconos */
.cqbar.dense{padding-top:8px}
.cqbar.dense .rt{padding:6px 10px 7px;font-size:13px}
.cqbar.dense .rib-body{padding:6px 10px;min-height:44px;gap:6px 8px}
.cqbar.dense .btn,.cqbar.dense .sb>button,.cqbar.dense .cmdk,.cqbar.dense .tb-sel select{min-height:32px;font-size:13px}
.cqbar.dense .rib-body .ckl{padding:4px 8px;font-size:13px}
.cqbar.icons .qp .lb,.cqbar.icons .rt .lb,.cqbar.icons .sb:not(.pri) .sb-main .lb,.cqbar.icons .cmdk .lb,.cqbar.icons .cmdk kbd,.cqbar.icons .fav .lb{display:none}
@media (max-width:1700px){.cqbar .cmdk kbd,.cqbar .cmdk .lb{display:none}}
@media (max-width:1500px){.cqbar .qp .lb{display:none}}
.cqbar .rt.on .lb{display:inline!important}
@media (max-width:1300px){.cqbar .rt .lb,.cqbar .fav .lb,.cqbar .sb:not(.pri) .sb-main .lb{display:none}.cqbar .wk .wsel{max-width:220px}}
@media (max-width:1250px){.rib-tabs,.tb-row{flex-wrap:wrap}}
/* Ajustes: tarjetas de tema */
.pal-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.sub-h{font:600 15px var(--f-body);margin:16px 0 8px;padding-top:12px;border-top:1px solid var(--line)}
.sub-h:first-child{margin-top:0;padding-top:0;border-top:0}
.pal-card{all:unset;cursor:pointer;border:2px solid var(--line);border-radius:10px;padding:10px;display:flex;flex-direction:column;gap:3px;background:var(--surface)}
.pal-card:hover{border-color:var(--line-2)}
.pal-card.on{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.pal-sw{display:flex;height:26px;border-radius:6px;overflow:hidden;margin-bottom:5px}
.pal-sw i{flex:1}
.pal-sw i:first-child{flex:2}
.pal-card small{color:var(--muted);font-size:12px}
.pdf-bottom{margin-top:14px}
.panel label.row{flex-wrap:nowrap}
.panel label.row>input[type=checkbox]{flex:none}

/* ===== v4.4 ===== */
/* elegir solo la hora o solo el nombre */
td.cell.sel.sp-nm,td.cell.sel.sp-hr,table.cq.editing td.cell.sel.sp-nm:hover,table.cq.editing td.cell.sel.sp-hr:hover{background:color-mix(in srgb,var(--sel-bg) 45%,transparent);box-shadow:inset 0 0 0 1px var(--sel)}
td.cell.sel.sp-nm .nm,td.cell.sel.sp-hr .hr{background:var(--sel-bg);box-shadow:0 0 0 2px var(--sel);border-radius:4px}
td.cell.sel.sp-hr .hr{color:var(--ink)}
table.cq td.cell .hr,table.cq td.cell .nm{cursor:pointer}
.cm-part{font-weight:600;font-size:11px;background:var(--sel-bg);color:var(--sel);border-radius:8px;padding:1px 7px;margin-left:4px;text-transform:uppercase;letter-spacing:.03em}
/* muesca de puestos ocultos */
table.cq tr.hid-gap td{padding:0!important;height:0;border:0!important;position:relative;background:none!important}
table.cq tr.hid-gap td::before{content:"";position:absolute;left:0;right:0;top:-2px;border-top:2px dashed var(--accent);opacity:.7;pointer-events:none;z-index:2}
.hid-notch{position:absolute;left:6px;top:-11px;z-index:3;font:600 11px var(--f-body);line-height:18px;padding:0 9px;border-radius:9px;border:1px solid var(--accent);background:var(--accent-soft);color:var(--ink);cursor:pointer;white-space:nowrap;box-shadow:0 1px 3px #0002}
.hid-notch:hover{background:var(--accent);color:var(--accent-ink)}
@media print{tr.hid-gap{display:none}}
/* Coord./Vigil. en la cabecera de la columna de puestos */
table.cq th.pst-h{padding:3px 4px}
.seg.mini{display:inline-flex;background:transparent;border:1px solid #ffffff55;border-radius:7px;overflow:hidden}
.seg.mini button{font:600 11.5px var(--f-body);padding:3px 8px;border:0;background:transparent;color:var(--band-muted);cursor:pointer;min-height:0}
.seg.mini button[aria-pressed="true"]{background:var(--surface);color:var(--ink)}
/* semana en dos líneas */
.cqbar .wk-b{position:relative;display:inline-flex;align-items:center;gap:8px;padding:3px 8px 3px 6px;cursor:pointer;min-width:150px}
.cqbar .wk-b:hover{background:var(--surface-2)}
.cqbar .wk-t{display:flex;flex-direction:column;line-height:1.15}
.cqbar .wk-t b{font-size:15px;white-space:nowrap}
.cqbar .wk-t b i{font-style:normal;font-size:11px;font-weight:600;color:var(--accent);margin-left:4px}
.cqbar .wk-t b i.up{color:var(--warn)}
.cqbar .wk-t small{font-size:12.5px;color:var(--muted);white-space:nowrap}
.cqbar .wk-b select.wsel{position:absolute;inset:0;opacity:0;cursor:pointer;width:100%;height:100%;max-width:none}
.cqbar .wk-b svg.wk-c{color:var(--muted)}
.cqbar .qb:disabled{opacity:.4;cursor:default}
/* Puestos: colores de coordinación y vigilancia */
.pu-t tr.r-coord td{background:var(--coord-bg)}
.pu-t tr.r-vs td{background:var(--vs-bg)}
.pu-t tr.r-coord td:first-child{box-shadow:inset 5px 0 0 var(--coord)}
.pu-t tr.r-vs td:first-child{box-shadow:inset 5px 0 0 var(--vs)}
.pu-t tr.r-coord td.pu-name input{color:var(--coord)}
.pu-t tr.r-vs td.pu-name input{color:var(--vs)}
.pu-t tr.r-coord+tr.r-vs td,.pu-t tr.r-vs+tr.r-coord td{border-top:2px solid var(--line-2)}
.pu-legend{display:flex;gap:10px;margin:0 0 8px;font-size:13px}
.pu-legend span{display:inline-flex;align-items:center;gap:6px;padding:3px 10px;border-radius:6px;font-weight:600}
/* Ajustes con barra lateral */
.aj-lay{display:grid;grid-template-columns:230px minmax(0,1fr);gap:20px;align-items:start}
.aj-nav{position:sticky;top:calc(var(--bandh,100px) + 12px);display:flex;flex-direction:column;gap:2px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:8px}
.aj-nav button{all:unset;box-sizing:border-box;display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:8px;cursor:pointer;font:500 14.5px var(--f-body);color:var(--ink)}
.aj-nav button:hover{background:var(--surface-2)}
.aj-nav button.on{background:var(--accent-soft);font-weight:700;box-shadow:inset 3px 0 0 var(--accent)}
.aj-nav button svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none;color:var(--muted)}
.aj-nav button.on svg{color:var(--accent)}
.aj-body{min-width:0}
.aj-one{display:block!important;max-width:820px}
.aj-one>.panel{margin:0 0 14px}
.aj-help .toolbar{margin-top:0}
@media (max-width:860px){.aj-lay{grid-template-columns:1fr}.aj-nav{position:static;flex-direction:row;overflow-x:auto}.aj-nav button{white-space:nowrap}}
/* visor de PDF */
dialog.dlg-pdf{width:min(1150px,96vw);max-width:96vw}
iframe.pdfv{width:100%;height:min(72vh,900px);border:1px solid var(--line-2);border-radius:8px;background:#525659}
.pdfv-h{margin:0 0 6px}
select.emp-link{font:inherit;font-weight:700;padding:3px 6px;border:1px solid var(--line);border-radius:6px;background:var(--surface);color:var(--ink);max-width:170px}
select.emp-link.none{color:var(--muted);font-weight:400;border-style:dashed}
table.cq td.cell.sel.sp-nm .nm.hit,table.cq td.cell.sel.sp-nm .nm{box-shadow:0 0 0 2px var(--sel)!important;background:var(--sel-bg)!important;color:var(--ink)}
@media (max-width:1300px){.edslim .es-opt{display:none}}

/* v4.4b: señal de puestos ocultos en la esquina del puesto */
table.cq td.pst{position:relative}
.hid-mk{position:absolute;left:0;width:0;height:0;padding:0;border:0;background:none;cursor:pointer;z-index:3}
.hid-mk.top{top:0;border-top:13px solid var(--accent);border-right:13px solid transparent}
.hid-mk.bot{bottom:0;border-bottom:13px solid var(--accent);border-right:13px solid transparent}
.hid-mk:hover{filter:brightness(.85)}
.hid-mk::after{content:"";position:absolute;left:-4px;top:-17px;width:22px;height:22px}
.hid-mk.bot::after{top:-5px}
table.cq th.pst-h{text-align:center}
table.cq th.pst-h .seg.mini{margin:0 auto}
table.cq tr.no-rows td{padding:22px 14px;text-align:center;color:var(--muted);background:var(--surface);font-size:14px}
.cqbar .wk-b{overflow:hidden}
.cqbar .wk-b select.wsel{box-sizing:border-box;padding:0;margin:0;border:0;font-size:14px}
.seg.mini{border-color:var(--line-2)!important;background:var(--surface)!important}
.seg.mini button{color:var(--muted)!important}
.seg.mini button[aria-pressed="true"]{background:var(--band)!important;color:var(--band-ink)!important}

/* v4.5 recuperar */
dialog.dlg-rc{width:min(1200px,97vw);max-width:97vw}
.rc-tools{display:flex;gap:6px;margin:0 0 8px;flex-wrap:wrap}
.rc-wrap{max-height:58vh;overflow:auto}
.rc-t th,.rc-t td{vertical-align:top;font-size:12.5px}
.rc-t td.rc-p b{display:block}.rc-t td.rc-p small{color:var(--muted)}
.rc-t td.rc-p.r-coord{box-shadow:inset 4px 0 0 var(--coord)}.rc-t td.rc-p.r-vs{box-shadow:inset 4px 0 0 var(--vs)}
.rc-t td.rc-c label{display:flex;gap:6px;align-items:flex-start;cursor:pointer;background:var(--accent-soft);border-radius:6px;padding:4px 6px}
.rc-t td.rc-c label:has(input:not(:checked)){background:transparent;opacity:.55}
.rc-t td.rc-c .rc-l{display:block;line-height:1.35}
.rc-t td.rc-c label>span:first-of-type{margin-top:0}
.rc-t td.rc-c em{font-style:normal;font-size:10.5px;color:var(--muted);font-weight:700}
.rc-t td.rc-c s{color:var(--crit)}.rc-t td.rc-c i{color:var(--muted)}
.rc-t td.same{color:var(--line-2);text-align:center}
.rc-src{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:8px}
.rc-src .btn{display:flex;flex-direction:column;align-items:flex-start;gap:3px;text-align:left;padding:10px 12px;height:auto;white-space:normal}
.rc-src .btn small{font-weight:400;color:var(--muted);font-size:12px}
#savewarn{position:fixed;left:50%;transform:translateX(-50%);bottom:16px;z-index:58;display:flex;align-items:center;gap:10px;max-width:min(860px,94vw);background:var(--crit);color:#fff;border-radius:12px;padding:10px 12px 10px 14px;box-shadow:0 10px 30px #0004;font-size:14px}
#savewarn .sw-i{font-size:18px}
#savewarn .btn{background:#fff;color:var(--crit);border-color:#fff;font-weight:700;white-space:nowrap}
#savewarn .sw-x{background:none;border:0;color:#fff;font-size:20px;cursor:pointer;padding:0 4px;opacity:.8}
@media print{#savewarn{display:none}}
.rc-t{table-layout:fixed;width:100%;min-width:980px}
.rc-t th:first-child,.rc-t td.rc-p{width:120px}
.rc-t td.rc-c label{display:flex!important;align-items:flex-start}
.rc-ls{display:flex;flex-direction:column;gap:2px;min-width:0;word-break:break-word}
.rc-t td.rc-c input{margin-top:2px;flex:none}
.rc-t td.rc-c{white-space:normal;padding:4px}

function createWeek(n, base) {

  const slots = DATA.puestos.filter(p => p.nombre).map(p => {
    const b = baseSlots.find(x => x.k === p.k);
    return { k: p.k, puesto: p.nombre, id: p.id, tipo: p.tipo, days: Array.from({ length: 7 }, (_, i) => { const bd = b ? b.days[i] : null; const cl = isClosed(bd); return { hM: cl ? '' : p.hor[2 * i] || '', hT: cl ? '' : p.hor[2 * i + 1] || '', M: bd ? bd.M : '', R: bd ? bd.R : '', T: bd ? bd.T : '' }; }) };
  });
  const w = { name: 'S' + n, year: DATA.anio, week: n, monday, slots, obs: ['', '', '', ''], lay: null };
  DATA.semanas.push(w); DATA.semanas.sort((a, b) => a.monday < b.monday ? -1 : 1);
  buildModel(); return w;
}

async function diffToIncidencias() {
  const w = DATA.semanas[UI.wi]; const ct = cmpTarget(w); if (!ct) return;
  const diffs = diffWeek(w, ct.week).filter(d => !d.t.startsWith('h') && (d.antes || d.ahora));
  const grouped = []; const seen = new Set();
  for (const d of diffs) {
    const key = d.k + '|' + d.i; if (seen.has(key + d.t)) continue;
    const pair = diffs.find(x => x.k === d.k && x.i === d.i && x !== d && x.antes === d.antes && x.ahora === d.ahora && ['M', 'T'].includes(x.t) && ['M', 'T'].includes(d.t));
    if (pair) { seen.add(key + 'M'); seen.add(key + 'T'); grouped.push({ ...d, turno: 'Todo el día' }); } else { seen.add(key + d.t); grouped.push({ ...d, turno: d.t === 'M' ? 'Mañana' : d.t === 'T' ? 'Tarde' : 'Relevo' }); }
  }
  const motivo = DATA.motivos[0] || 'Cambio entre compañeros';
  grouped.forEach(d => DATA.incidencias.push({ fecha: w.days[d.i], puesto: d.puesto, turno: d.turno, sale: d.antes, entra: d.ahora, motivo, desc: 'Cambio sobre el cuadrante publicado', por: S.autor || '' }));
  markDirty(); toast(`${grouped.length} incidencia(s) añadidas. Revisa el motivo en «Ausencias e incidencias».`, 5000); render();
}
